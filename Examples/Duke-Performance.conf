# Duke Nukem 3D Atomic Edition, tested at 320x200 on the Intel MacBook Pro.
# Merge this CPU setting into the gamebox's DOSBox Preferences.conf.
# In Boxer, select Quiet and a 100,000-cycle Automatic Speed Limit to also
# update any saved per-game override. Other video/audio settings are unchanged.
# Higher in-game resolutions may need a higher limit or Unlimited.

[cpu]
cycles=max 50% limit 100000
