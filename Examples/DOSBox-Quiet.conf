# The CPU setting used for the Duke Nukem 3D performance test.
# Merge this section into the game's "DOSBox Preferences.conf"; keep its other
# settings and startup commands. Alternatively, select Quiet from Boxer's
# Emulation > Automatic CPU Usage menu, which also updates saved UI overrides.
# This scales DOSBox's automatic CPU target; it is not a whole-Mac CPU cap.

[cpu]
cycles=max 50%
